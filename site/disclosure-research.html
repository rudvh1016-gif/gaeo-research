<body data-page="research">
<header id="site-head"></header>
<main id="main" class="wrap">
  <h1>기업 리서치</h1>
  <p class="lede">회사가 금융감독원 전자공시(DART)에 낸 공시만으로 무엇이 달라졌는지 봅니다. 주가·점수·매수매도 판단은 싣지 않습니다. 자료 공급: 하루 두 번(OpenDART).</p>
  <p class="meta" id="asOf">자료 불러오는 중…</p>

  <div class="search" role="search">
    <input id="q" list="companies" placeholder="회사 이름 또는 종목코드 6자리" aria-label="회사 검색" autocomplete="off">
    <datalist id="companies"></datalist>
    <button type="button" id="go">보기</button>
    <button type="button" id="clear">전체</button>
  </div>

  <div class="tabs" role="tablist" aria-label="기업 리서치 화면">
    <button role="tab" aria-selected="true" data-tab="today" id="tab-today">오늘의 공시</button>
    <button role="tab" aria-selected="false" data-tab="changes" id="tab-changes">공시 변화</button>
    <button role="tab" aria-selected="false" data-tab="financial" id="tab-financial">재무 변화</button>
    <button role="tab" aria-selected="false" data-tab="timeline" id="tab-timeline">사건 흐름</button>
  </div>

  <section id="view-today" role="tabpanel" aria-labelledby="tab-today"><p class="meta">불러오는 중…</p></section>
  <section id="view-changes" role="tabpanel" aria-labelledby="tab-changes" class="hidden"></section>
  <section id="view-financial" role="tabpanel" aria-labelledby="tab-financial" class="hidden"></section>
  <section id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline" class="hidden"></section>

  <p class="small">원본 자료 파일: <a href="/disclosure_research/contract.json">contract.json</a> · <a href="/disclosure_research/disclosure_changes.json">공시 변화</a> · <a href="/disclosure_research/financial_changes.json">재무 변화</a> · <a href="/disclosure_research/event_timelines.json">사건 흐름</a></p>
</main>
