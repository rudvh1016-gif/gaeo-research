<body data-page="research">
<header id="site-head"></header>
<main id="main" class="wrap">
  <div class="page-head">
    <h1>기업 리서치</h1>
    <p class="lede">회사가 금융감독원 전자공시(DART)에 낸 공시만으로 무엇이 달라졌는지 봅니다. 주가·점수·매수매도 판단은 싣지 않습니다.</p>
  </div>

  <form class="search-panel" role="search" id="search-form" action="/disclosure-research.html" method="get">
    <label for="q">회사 이름 또는 종목코드</label>
    <div class="search-row">
      <input id="q" name="code" list="companies" placeholder="예: 삼성전자 · 005930" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="btn btn-primary" id="go">보기</button>
      <button type="button" class="btn" id="clear">전체 보기</button>
    </div>
    <datalist id="companies"></datalist>
    <p class="meta" id="asOf" aria-live="polite">자료 기준을 불러오고 있어요</p>
  </form>

  <section id="overview" class="hidden" aria-labelledby="ov-title" tabindex="-1"></section>

  <div class="tabs" role="tablist" aria-label="기업 리서치 화면">
    <button type="button" role="tab" aria-selected="true" aria-controls="view-today" data-tab="today" id="tab-today">최근 공시</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="view-changes" data-tab="changes" id="tab-changes" tabindex="-1">공시 변화</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="view-financial" data-tab="financial" id="tab-financial" tabindex="-1">재무 변화</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="view-timeline" data-tab="timeline" id="tab-timeline" tabindex="-1">사건 흐름</button>
  </div>

  <section id="view-today" role="tabpanel" aria-labelledby="tab-today" tabindex="-1">
    <noscript><div class="state"><p class="state-title">자바스크립트를 켜야 이 화면이 보여요</p><p>최근 접수된 공시는 <a href="/">홈</a>에서도 볼 수 있어요. 원문은 <a href="https://dart.fss.or.kr/">DART</a>에서 확인할 수 있어요.</p></div></noscript>
  </section>
  <section id="view-changes" role="tabpanel" aria-labelledby="tab-changes" class="hidden" tabindex="-1"></section>
  <section id="view-financial" role="tabpanel" aria-labelledby="tab-financial" class="hidden" tabindex="-1"></section>
  <section id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline" class="hidden" tabindex="-1"></section>

  <section id="related" class="section hidden" aria-labelledby="rel-title"></section>
