# GAEO 기업 리서치 — OpenDART 공시·재무 수집과 공시 연구 산출물 생성 (단일 생산자)
#
# 옛 저장소(gaeo-analyst-team)의 같은 이름 워크플로를 옮겼다. 같은 스크립트 · 같은 하루 예산 원장
# (research_archive/dart/api_budget.json) · 같은 cron 2회/일. 새 cron 없음 · 새 키 없음.
#
# ⚠️ 이전 기간의 이중 소비 방지: 예약 실행은 저장소 변수 DART_PRODUCER_ACTIVE 가 'true' 일 때만 돈다.
#    옛 저장소의 예약 수집을 멈춘 날 소유자가 이 변수를 켠다. 둘이 동시에 같은 키를 쓰지 않는다.
# 조회 실패·페이지 누락·건수 불일치를 0건으로 바꾸지 않는다. 키 값은 어떤 로그·산출물에도 남지 않는다.
name: corporate-action-evidence

on:
  schedule:
    - cron: "10 22 * * 0-4"
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "이번 회차에 볼 종목 수 상한"
        default: "40"
      requests:
        description: "이번 회차 API 요청 수 상한"
        default: "300"
      commit:
        description: "산출물을 main 에 커밋 (기본 true)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: corporate-action-evidence
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'schedule' || vars.DART_PRODUCER_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
      # DART 원문 아카이브 암호화 키. 없으면 원문을 남기지 않고 수집 확인(ACK)도 하지 않는다(FAIL CLOSED).
      RESEARCH_ARCHIVE_KEY: ${{ secrets.RESEARCH_ARCHIVE_KEY }}
      TZ: Asia/Seoul
      TARGET_COUNT: ${{ inputs.tickers || '4000' }}
      REQUEST_LIMIT: ${{ inputs.requests || '5200' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 거래일 판정 (예약 발화가 휴장일이면 수집하지 않는다)
        run: |
          rc=0
          python3 -c "import datetime,sys; from krx_calendar import is_krx_trading_day; sys.exit(0 if is_krx_trading_day(datetime.date.today()) else 9)" || rc=$?
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$rc" = "9" ]; then
            echo "오늘은 KRX 휴장일 — 예약 수집을 건너뛴다 (예산 0 소모)"
            echo "SKIP_COLLECT=1" >> "$GITHUB_ENV"
          elif [ "$rc" != "0" ] && [ "$rc" != "9" ]; then
            echo "::warning::휴장일 달력 판정 실패(exit $rc) — 종전 동작대로 진행한다"
          fi

      - name: Secret 존재 여부만 확인 (값·길이 출력 없음)
        if: env.SKIP_COLLECT != '1'
        run: |
          if [ -n "$OPEN_DART_API_KEY" ]; then
            echo "secretPresent: true"
          else
            echo "secretPresent: false"
            echo "::error::OPEN_DART_API_KEY 가 없습니다. 수집을 시작하지 않습니다."
            exit 1
          fi

      - name: 수집 대상 공급자 확인 (OpenDART 외 호스트 0)
        run: python3 tools/public_checks.py --producer-hosts

      - name: 암호화 라이브러리 설치
        run: python3 -m pip install --quiet --upgrade cryptography

      - name: 오프라인 불변식 시험 (실패가 0건으로 바뀌지 않는지)
        run: python3 -m unittest test_corporate_action_evidence

      - name: 실제 수집 — 기업행사 증거
        id: collect
        if: env.SKIP_COLLECT != '1'
        env:
          FULL_REFRESH: ${{ github.event_name == 'schedule' && '--require-complete' || '' }}
        run: python3 collect_corporate_action_evidence.py --tickers "$TARGET_COUNT" --requests "$REQUEST_LIMIT" $FULL_REFRESH

      - name: 오늘의 공시 수집 · 연간 재무 수집 (OpenDART · 네트워크)
        if: env.SKIP_COLLECT != '1'
        run: |
          python3 collect_dart.py || echo "DART 공시 수집 실패 — 나머지는 계속 진행"
          python3 collect_dart_financials.py --once-per-day || echo "재무 수집 실패 — 나머지는 계속 진행"

      - name: 오늘의 공시 · 공시 연구 산출물 생성 (네트워크 0 · LLM 0)
        if: env.SKIP_COLLECT != '1'
        run: |
          python3 build_dart_today.py || echo "dart_today.js 생성 실패 — 이전 파일 유지"
          python3 build_disclosure_research.py || echo "disclosure_research 생성 실패 — 이전 파일 유지"

      - name: 공개 누출 검사 (커밋 전)
        id: leak
        # 수집이 일부 실패해도 커밋 전에는 반드시 검사한다. 이 체크아웃은 얕아서(fetch-depth 1)
        # 이력 검사(--history)는 CI·pages 가 맡는다 — 여기서 돌리면 누출이 없어도 항상 실패한다(2026-09-25 실측).
        if: ${{ always() && env.SKIP_COLLECT != '1' }}
        run: python3 tools/public_checks.py --producer-hosts --tree --past

      - name: 산출물 커밋
        # 실패·부분 수집도 예산은 썼다. 사용량 기록은 남기되 부분 갱신을 성공처럼 보이게 하지 않는다.
        # 누출 검사를 통과하지 못하면 어떤 경우에도 커밋하지 않는다.
        if: ${{ always() && steps.collect.outcome != 'skipped' && steps.leak.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.commit) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 dart_budget.py --install-git-merge-driver
          git add gaeo_coverage/corporate_action_evidence.json research_archive/dart/api_budget.json
          [ -d research_archive/dart ] && git add research_archive/dart
          [ -d dart_financials ] && git add dart_financials
          [ -f dart_today.js ] && git add dart_today.js
          [ -d disclosure_research ] && git add disclosure_research
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "공시 수집 · 공시 연구 갱신 (GitHub Actions)"
            saved=0
            for i in 1 2 3 4; do
              if git push origin main; then saved=1; break; fi
              sleep $((2 ** i))
              git pull --rebase origin main || exit 1
            done
            test "$saved" = 1
          fi
